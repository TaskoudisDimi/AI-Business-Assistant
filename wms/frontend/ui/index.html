<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#107d71">
    <meta name="description" content="Warehouse management for small businesses: stock levels, orders, reorder alerts and sales forecasts in one place.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS — Warehouse management for growing businesses</title>
    <script>
      // Set the theme before first paint so dark-mode users don't see a light flash
      (function () {
        var pref = null
        try { pref = localStorage.getItem('theme') } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        try { var l = localStorage.getItem('locale'); if (l) document.documentElement.lang = l } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
